name: CI

on:
  # pushes to main run this pipeline through release.yml (workflow_call)
  pull_request:
  # weekly run so new CVEs in dependencies / the Go stdlib are detected even without commits
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  # the release workflow runs the full pipeline before publishing
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOVULNCHECK_VERSION: v1.8.0
  PROMETHEUS_VERSION: v3.14.0
  GORELEASER_VERSION: v2.18.3

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # single source of truth for the linter versions: .pre-commit-config.yaml (updated by Dependabot)
      - name: Read linter versions from .pre-commit-config.yaml
        id: versions
        run: |
          rev_of() {
            awk -v repo="repo: $1" 'index($0, repo) { found = 1; next } found && $1 == "rev:" { print $2; exit }' .pre-commit-config.yaml
          }
          golangci_lint=$(rev_of https://github.com/golangci/golangci-lint)
          actionlint=$(rev_of https://github.com/rhysd/actionlint)
          if [ -z "$golangci_lint" ] || [ -z "$actionlint" ]; then
            echo "::error file=.pre-commit-config.yaml::could not read the golangci-lint/actionlint versions"
            exit 1
          fi
          {
            echo "golangci-lint=${golangci_lint}"
            echo "actionlint=${actionlint#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Check go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.versions.outputs.golangci-lint }}

      - name: Lint GitHub Actions workflows
        if: ${{ !cancelled() }}
        env:
          ACTIONLINT_VERSION: ${{ steps.versions.outputs.actionlint }}
        run: docker run --rm -v "$PWD:/repo" --workdir /repo "rhysd/actionlint:${ACTIONLINT_VERSION}" -color

      - name: Lint Dockerfile
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "go.mod" = the version the project declares, "stable" = latest Go release
        go: [go.mod, stable]
    # S3-compatible server for the integration tests in storage/provider/s3_integration_test.go
    services:
      s3:
        image: adobe/s3mock:5.2.3
        ports:
          - 9090:9090
    env:
      BACKMON_TEST_S3_ENDPOINT: http://localhost:9090
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}

      - name: Wait for the S3 test server
        run: curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null "$BACKMON_TEST_S3_ENDPOINT"

      - name: Run tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          {
            echo "### Coverage (Go ${{ matrix.go }})"
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: matrix.go == 'go.mod'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          # runs on main are the baseline for the coverage report of PRs
          retention-days: 90

  coverage:
    name: Coverage report
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # download the coverage of main from the latest release workflow run
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: current

      - name: Download coverage of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow release.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ] || ! gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n coverage -D base; then
            echo "::notice::No coverage of main found, the report shows absolute values only"
          fi

      - name: Build report
        run: |
          python3 .github/scripts/coverage-report.py current/coverage.out base/coverage.out > coverage-report.md
          cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      # one comment per PR, updated on every push; not possible for PRs from forks or Dependabot
      # (read-only token), the report is in the job summary then
      - name: Comment on pull request
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- coverage-report -->"))) | .id' | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F body=@coverage-report.md > /dev/null
          else
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file coverage-report.md
          fi

  smoke:
    name: Smoke test (/metrics)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build binary
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/smoke/backmon" .

      - name: Start backmon against _samples
        working-directory: ${{ runner.temp }}/smoke
        run: |
          cat > config.yaml <<CFG
          port: 8000
          update_interval: 5
          environments:
            samples:
              path: ${GITHUB_WORKSPACE}/_samples
          CFG
          ./backmon -background > backmon.log 2>&1 &
          echo $! > backmon.pid

      - name: Check /metrics
        working-directory: ${{ runner.temp }}/smoke
        run: |
          # wait for the webserver
          curl -fsS --retry 15 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:8000/metrics
          # give the first disk update a moment to finish
          sleep 6
          curl -fsS http://localhost:8000/metrics > metrics.txt

          grep -q '^backmon_environments_total' metrics.txt || { echo "::error::backmon_environments_total missing"; exit 1; }
          grep -q '^backmon_disks_total' metrics.txt || { echo "::error::backmon_disks_total missing"; exit 1; }
          grep -q '^backmon_definition_status' metrics.txt \
            || echo "::warning::no backmon_definition_status metric found for _samples"

          # Prometheus lint of the exposition format; non-blocking until existing naming issues are fixed
          docker run --rm -i --entrypoint promtool "prom/prometheus:${PROMETHEUS_VERSION}" check metrics < metrics.txt \
            || echo "::warning::promtool reported issues with the exposed metrics (see log)"

      - name: Show backmon log
        if: always()
        working-directory: ${{ runner.temp }}/smoke
        run: |
          kill "$(cat backmon.pid)" 2>/dev/null || true
          cat backmon.log

  release-check:
    name: GoReleaser (snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check config and build all release binaries
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: build --snapshot --clean

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # use the Go version from go.mod so vulnerabilities in the shipped stdlib are reported
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: go
          build-mode: autobuild

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          # same category on PRs (ci.yml) and on main (release.yml calls ci.yml), so PRs can be compared with main
          category: /language:go

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # same platforms as the release; multi-platform images can't be loaded into the local docker daemon
      - name: Build multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_TAG=ci

      # amd64 image from cache, loaded for the smoke test and the Trivy scan
      - name: Load amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: backmon:ci
          cache-from: type=gha
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_TAG=ci

      - name: Smoke test image
        run: |
          mkdir -p "$RUNNER_TEMP/image-smoke"
          printf 'port: 8000\nenvironments:\n  samples:\n    path: /samples\n' > "$RUNNER_TEMP/image-smoke/config.yaml"
          docker run -d --name backmon -p 8000:8000 \
            -v "$RUNNER_TEMP/image-smoke/config.yaml:/etc/backmon/config.yaml:ro" \
            -v "$GITHUB_WORKSPACE/_samples:/samples:ro" \
            backmon:ci
          if ! curl -fsS --retry 15 --retry-delay 1 --retry-all-errors http://localhost:8000/metrics | grep -q '^backmon_disks_total'; then
            docker logs backmon
            exit 1
          fi
          # the image must not run as root
          test "$(docker inspect --format '{{.Config.User}}' backmon:ci)" = "65532:65532"
          docker rm -f backmon

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: backmon:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # reporting only; govulncheck is the blocking gate for Go code
          exit-code: '0'

      - name: Upload Trivy results
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy.sarif
          category: trivy
