name: Release

# On every push to main (i.e. every merged PR):
# 1. run the full CI pipeline
# 2. semantic-release (dreitier/shared-ci-components/semantic-release, its default config) derives the next
#    version from the Conventional Commits since the last tag, updates CHANGELOG.md, pushes the release
#    commit + tag and creates the GitHub release.
#    Nothing happens if there are only non-releasing commits (docs, ci, chore, ...).
# 3. GoReleaser attaches binaries for linux/darwin/windows (amd64, arm64), checksums and SBOMs
# 4. multi-arch Docker images are pushed to Docker Hub and GHCR
# Binaries and images get build provenance attestations (verify with `gh attestation verify`).
# The image's CycloneDX SBOM goes to Dependency-Track (secret DEPENDENCYTRACK_API_KEY). Trivy, SBOM, upload and
# image signing come from dreitier/shared-ci-components.
on:
  push:
    branches:
      - main
  # re-run a release attempt manually, e.g. after a failed publish
  workflow_dispatch:

permissions:
  contents: read

# never run two releases at the same time, and never cancel one halfway
concurrency:
  group: release
  cancel-in-progress: false

env:
  GORELEASER_VERSION: v2.18.3

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      actions: read

  semantic-release:
    name: Version & GitHub release
    needs: ci
    runs-on: ubuntu-latest
    # all writes use the GitHub App token, which may bypass the branch protection of main
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      # checkout, release tooling, bot identity and the default config come with the action
      # (tag x.y.z, CHANGELOG.md, GitHub release without PR comments)
      - name: Run semantic-release
        id: release
        uses: dreitier/shared-ci-components/semantic-release@c8ebf58b2404cb3f7307c155525c68abfe1fc580 # v1.1.0
        with:
          app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # exactly the existing header of CHANGELOG.md – another title would be added on top of it
          changelog-title: "# Changelog\n\nAll notable changes to this project are documented in this file. It is generated by [semantic-release](https://github.com/semantic-release/semantic-release) from [Conventional Commits](https://www.conventionalcommits.org/); entries up to 3.2.2 were written by hand following [Keep a Changelog](https://keepachangelog.com/en/1.0.0/). The project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)."

  binaries:
    name: Binaries
    needs: semantic-release
    if: needs.semantic-release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.semantic-release.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # cosign signs checksums.txt (signs: in .goreleaser.yaml)
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3

      # syft generates the SBOMs configured in .goreleaser.yaml
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance of the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  image:
    name: Docker image
    needs: semantic-release
    if: needs.semantic-release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      VERSION: ${{ needs.semantic-release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.semantic-release.outputs.version }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4.0.0 -> 4.0.0, 4.0, 4, latest
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            dreitier/backmon
            ghcr.io/dreitier/backmon
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Short commit
        id: git
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          build-args: |
            GIT_COMMIT=${{ steps.git.outputs.short_sha }}
            GIT_TAG=${{ env.VERSION }}

      # keyless Sigstore signatures (GitHub OIDC identity of this workflow), verifiable with `cosign verify`;
      # the provenance comes from actions/attest-build-provenance below
      - name: Sign images
        uses: dreitier/shared-ci-components/cosign-sign@c8ebf58b2404cb3f7307c155525c68abfe1fc580 # v1.1.0
        with:
          images: |
            index.docker.io/dreitier/backmon
            ghcr.io/dreitier/backmon
          digest: ${{ steps.build.outputs.digest }}

      - name: Attest image on Docker Hub
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/dreitier/backmon
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest image on GHCR
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/dreitier/backmon
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # CycloneDX SBOM of the released image → Dependency-Track (project backmon, version = release). A separate
  # job: a Dependency-Track outage must not fail the image job. The image is public – no login.
  sbom:
    name: SBOM → Dependency-Track
    needs: [semantic-release, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate SBOM
        id: sbom
        uses: dreitier/shared-ci-components/sbom@c8ebf58b2404cb3f7307c155525c68abfe1fc580 # v1.1.0
        with:
          image: ghcr.io/dreitier/backmon@${{ needs.image.outputs.digest }}

      - name: Upload to Dependency-Track
        uses: dreitier/shared-ci-components/dependency-track-upload@c8ebf58b2404cb3f7307c155525c68abfe1fc580 # v1.1.0
        with:
          api-key: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
          bom: ${{ steps.sbom.outputs.file }}
          project-name: backmon
          project-version: ${{ needs.semantic-release.outputs.version }}

  # helm-charts opens a PR that updates the backmon chart to this version (.github/workflows/update-backmon.yaml there)
  helm-chart:
    name: Trigger Helm chart update
    needs: [semantic-release, image]
    if: needs.semantic-release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create GitHub App token for dreitier/helm-charts
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: dreitier
          repositories: helm-charts
          # repository_dispatch requires write access to the repository contents
          permission-contents: write

      - name: Send repository_dispatch to dreitier/helm-charts
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.semantic-release.outputs.version }}
        run: |
          gh api --method POST repos/dreitier/helm-charts/dispatches \
            -f event_type=backmon-released \
            -f "client_payload[version]=${VERSION}"
          echo "Requested Helm chart update to backmon ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

  # dreitier/basement opens a PR that deploys this image to our own cluster (.github/workflows/update-app.yml there)
  deploy:
    name: Trigger update of our own deployment
    needs: [semantic-release, image]
    if: needs.semantic-release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create GitHub App token for dreitier/basement
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: dreitier
          repositories: basement
          # repository_dispatch requires write access to the repository contents
          permission-contents: write

      - name: Send repository_dispatch to dreitier/basement
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.semantic-release.outputs.version }}
        run: |
          gh api --method POST repos/dreitier/basement/dispatches \
            -f event_type=app-released \
            -f "client_payload[app]=backmon" \
            -f "client_payload[version]=${VERSION}"
          echo "Requested the basement update to backmon ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

  # backmon-docs is deployed again, so that its landing page shows this version (.github/workflows/deploy.yaml there)
  docs:
    name: Trigger deployment of the documentation
    needs: [semantic-release, image]
    if: needs.semantic-release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create GitHub App token for dreitier/backmon-docs
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: dreitier
          repositories: backmon-docs
          # repository_dispatch requires write access to the repository contents
          permission-contents: write

      - name: Send repository_dispatch to dreitier/backmon-docs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.semantic-release.outputs.version }}
        run: |
          gh api --method POST repos/dreitier/backmon-docs/dispatches \
            -f event_type=backmon-released \
            -f "client_payload[version]=${VERSION}"
          echo "Requested deployment of the documentation for backmon ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
