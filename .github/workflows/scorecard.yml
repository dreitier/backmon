name: Scorecard

# OpenSSF Scorecard: supply-chain security checks (branch protection, pinned dependencies,
# token permissions, ...). Results appear in the Security tab and on https://scorecard.dev,
# which also serves the badge in the README.
# Publishing results requires this restricted layout: no top-level env/defaults, only
# read permissions at the top level and only the steps below in the job.
on:
  # re-evaluate when the branch protection changes
  branch_protection_rule:
  schedule:
    - cron: '23 5 * * 1'
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # upload the results to code scanning
      security-events: write
      # publish the results to scorecard.dev (badge)
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: scorecard
