# golangci-lint v2 configuration
# https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose      # unclosed HTTP response bodies (S3 / download streaming)
    - copyloopvar
    - errorlint      # proper error wrapping / comparison
    - gosec          # security issues
    - misspell
    - nolintlint     # keep //nolint directives honest
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G104 # unchecked errors, already covered by errcheck
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      # tests may open fixture files by variable path and ignore some errors
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      # date components from time.Time are always within the range of the smaller unsigned types
      - path: backup/timestamp\.go
        linters:
          - gosec
        text: G115

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dreitier/backmon

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
