name: PR title

# PRs are squash-merged and the PR title becomes the commit message on main,
# which semantic-release uses to determine the next version.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    uses: dreitier/shared-ci-components/.github/workflows/conventional-pr-title.yml@486b3fed3ce26e365ef8de6a17cde2ad86b4e269 # v1.3.0
